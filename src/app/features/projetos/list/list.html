<p-table [value]="projetos()" size="small" selectionMode="single">
  <ng-template #header>
    <tr>
      <th style="width: 12%">Chave</th>
      <th style="width: 28%">Nome</th>
      <th>Cliente</th>
      <th>Responsável</th>
      <th>Início</th>
      <th>Final</th>
      <th>Status</th>
      <th>Ações</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-projeto>
    <tr>
      <td>{{ projeto.chave }}</td>
      <td>{{ projeto.nome }}</td>
      <td>{{ projeto.cliente }}</td>
      <td>{{ projeto.responsavel }}</td>
      <td>{{ projeto.dataInicio }}</td>
      <td>{{ projeto.dataFinal || '-' }}</td>
      <td>
        <p-tag [value]="projeto.status" [severity]="getSeverity(projeto.status)" />
      </td>
      <td>
        <p-button icon="pi pi-pencil" severity="secondary" rounded [routerLink]="[projeto.id, 'detalhe']" />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="8" class="projetos-list__empty">Nenhum projeto cadastrado</td>
    </tr>
  </ng-template>
</p-table>
