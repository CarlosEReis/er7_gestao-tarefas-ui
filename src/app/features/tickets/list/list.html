<p-table [value]="tickets()" size="small" selectionMode="single">
  <ng-template #header>
    <tr>
      <th style="width:5%">Ticket</th>
      <th style="width:5%">Abertura</th>
      <th style="width:3%">Desenv.</th>
      <th style="width:24%">Título</th>
      <th style="width:7%" class="tickets-list__members-header">Membros</th>
      <th>Projeto</th>
      <th>Tipo</th>
      <th>Priori</th>
      <th>Status</th>
      <th>Branch</th>
      <th>Ações</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-ticket>
    <tr>
      <td>{{ ticket.ticketId }}</td>
      <td>{{ ticket.dtAbertura }}</td>
      <td style="text-align: center !important; padding: none !important;">
        <p-avatar [image]="ticket.desenvolvedor.foto" pTooltip="{{ ticket.desenvolvedor.nome }}" shape="circle" style="vertical-align: middle"/>
      </td>
      <td>{{ ticket.titulo }}</td>
      <td>
        <div class="tickets-list__members" aria-label="Membros do ticket">
          @for (member of memberAvatars(ticket); track trackMember($index, member)) {
            <p-avatar
              [image]="member.foto"
              [ariaLabel]="member.nome"
              [pTooltip]="member.nome"
              shape="circle"
            />
          }
        </div>
      </td>
      <td>{{ ticket.projeto }}</td>
      <td>
        <p-tag [value]="ticket.tipo" [severity]="getSeverityType(ticket.tipo)" />
      </td>
      <td>
        <p-tag [value]="ticket.prioridade" [severity]="getSeverityPriority(ticket.prioridade)" />
      </td>
      <td class="tickets-list__status-cell" [style.background-color]="statusColor(ticket)">
        {{ ticket.status }}
      </td>
      <td>{{ ticket.branch }}</td>
      <td>
        <p-button icon="pi pi-pencil" severity="secondary" rounded [routerLink]="[ticket.id ?? ticket.ticketId, 'detalhe']" />
      </td>
    </tr>
  </ng-template>
</p-table>
